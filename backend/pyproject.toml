[project]
name = "go-high"
version = "0.1.0"
description = "go-high growth platform (API and worker)"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.142",
    "uvicorn[standard]>=0.54",
    "sqlalchemy>=2.1",
    "alembic>=1.20",
    "psycopg[binary]>=3.3",
    "cryptography>=50.0.2",
    "phonenumbers>=9.0.41",
    "tzdata>=2026.5",
]

[dependency-groups]
dev = [
    "pytest>=9",
    "httpx2>=2.13.1",
    "ruff>=0.15",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["perf: timing checks that depend on the machine; leave them out with -m 'not perf'"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.uv]
package = false

[tool.ruff.lint.isort]
known-third-party = ["alembic"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "app.permissions.requires", "app.permissions.requires_object",
                          "app.permissions.requires_records", "app.permissions.requires_trash"]

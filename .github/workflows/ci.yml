name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: gohigh
          POSTGRES_USER: gohigh
          POSTGRES_PASSWORD: gohigh
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U gohigh" --health-interval 5s --health-retries 20
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+psycopg://gohigh:gohigh@127.0.0.1:5432/gohigh
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run pytest -q -m "not perf"  # timing tests run locally; shared runners would make them flaky
      - name: Migrations up, model drift check, down
        run: |
          uv run alembic upgrade head
          uv run alembic check
          uv run alembic downgrade base

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker compose up -d --build --wait
      - name: API healthy and worker running
        run: |
          curl -fsS http://127.0.0.1:8000/api/health
          curl -fsS http://127.0.0.1:8000/ | grep -q '<div id="root">'
          docker compose ps worker --format '{{.State}}' | grep -q running
      - if: failure()
        run: docker compose logs

<!doctype html>
<html lang="en" data-theme="light" data-density="comfortable">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>go-high</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234f46e5'/%3E%3Ctext x='16' y='23' font-size='20' font-family='sans-serif' font-weight='700' text-anchor='middle' fill='white'%3Eg%3C/text%3E%3C/svg%3E" />
    <script>
      // Apply the saved theme and density before first paint. Light is the default; the OS setting is ignored.
      try {
        var t = JSON.parse(localStorage.getItem("gh:theme")), d = JSON.parse(localStorage.getItem("gh:density"));
        if (t === "dark") document.documentElement.dataset.theme = "dark";
        if (d === "compact") document.documentElement.dataset.density = "compact";
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
